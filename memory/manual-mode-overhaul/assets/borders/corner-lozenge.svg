<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
  <!--
    corner-lozenge — canonical HUD card corner ornament
    Usage: top-left corner as-is; rotate 90/180/270 for other corners.
    Fill references --ember-deep so the diamond "holes through" to nothing.
    Stroke references --gold-rim for the border color.
    Swap this symbol body to replace with real art later.
  -->
  <!-- Diamond: 14×14 square rotated 45° around center (16,16) -->
  <rect x="9" y="9" width="14" height="14"
        fill="var(--ember-deep, #0d0820)"
        stroke="var(--border-stroke, var(--gold-rim, #c8a020))"
        stroke-width="1.5"
        transform="rotate(45 16 16)"/>
  <!-- Short accent tick on inner diagonal, top edge direction -->
  <line x1="16" y1="5" x2="16" y2="9"
        stroke="var(--border-stroke, var(--gold-rim, #c8a020))"
        stroke-width="1"
        stroke-linecap="round"
        opacity="0.5"/>
</svg>
