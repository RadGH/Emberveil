<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="rsg-game" content="Emberveil">
<script src="./_header.js" defer></script>
<script src="./_footer.js" defer></script>
<link rel="stylesheet" href="./_shared-styles.css">
<link rel="stylesheet" href="./_tool-styles.css">
<title>Quest Graph — Emberveil</title>
<style>
body { padding: 1rem 1rem 5rem; }
.wrap { max-width: 1200px; margin: 0 auto; }

h1 {
  font-family: 'Cinzel', Georgia, serif;
  font-size: 1.4rem; margin: 0 0 0.2rem;
  letter-spacing: 0.08em; text-transform: uppercase; font-weight: 900;
  background: linear-gradient(180deg,#f8d880 0%,#e8a040 40%,#c04030 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
p.sub { color: var(--muted); font-size: 0.82rem; margin: 0 0 1.2rem; }

.toolbar {
  display: flex; gap: 0.6rem; flex-wrap: wrap;
  margin-bottom: 1rem; align-items: flex-end;
}
.toolbar label { font-size: 0.82rem; color: var(--muted); display: flex; flex-direction: column; gap: 0.2rem; }
.toolbar select {
  background: var(--card, #221520);
  border: 1px solid rgba(232,160,32,0.2);
  border-radius: 6px; color: var(--fg, #f0e8d8); font-size: 0.88rem;
  padding: 0.4rem 0.6rem; min-height: 38px; min-width: 260px;
}

.main-layout {
  display: grid;
  grid-template-columns: 1fr 300px;
  gap: 1rem;
  align-items: start;
}
@media (max-width: 800px) {
  .main-layout { grid-template-columns: 1fr; }
}

.graph-wrap {
  background: var(--card, #221520);
  border: 1px solid rgba(232,160,32,0.2);
  border-radius: 8px;
  overflow-x: auto;
  min-height: 280px;
  padding: 0.5rem;
}
.graph-wrap svg { display: block; }

.detail-panel {
  background: var(--card, #221520);
  border: 1px solid rgba(232,160,32,0.2);
  border-radius: 8px; padding: 0.8rem;
  position: sticky; top: 4rem;
}
.panel-title {
  font-family: 'Cinzel', serif; font-size: 0.85rem; font-weight: 700;
  color: #e8a020; letter-spacing: 0.08em; text-transform: uppercase;
  margin-bottom: 0.6rem;
}
.panel-empty { color: var(--muted, #9a8a70); font-size: 0.82rem; font-style: italic; }

.cond-head { font-size: 0.78rem; color: #a08030; font-weight: 600; margin-bottom: 0.25rem; }
.cond-val  { font-size: 0.82rem; color: var(--fg, #f0e8d8); margin-bottom: 0.6rem; word-break: break-word; }
.next-el   { font-size: 0.78rem; color: var(--muted, #9a8a70); margin-bottom: 0.6rem; }
.id-el     { font-size: 0.75rem; color: var(--muted, #9a8a70); margin-bottom: 0.5rem; font-family: monospace; }
.eff-head  { font-size: 0.78rem; color: #e8a020; font-weight: 600; margin-bottom: 0.4rem; }

.effect-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.3rem; }
.effect-item {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 5px; padding: 0.3rem 0.5rem;
  font-size: 0.8rem; color: var(--fg, #f0e8d8);
}
.effect-type { color: #e8a020; font-weight: 600; font-size: 0.72rem; text-transform: uppercase; margin-right: 0.3rem; }

.quest-summary { font-size: 0.82rem; color: var(--muted); margin: 0 0 0.6rem 0.4rem; font-style: italic; max-width: 700px; }

.legend {
  display: flex; gap: 0.8rem; flex-wrap: wrap; margin-bottom: 0.8rem;
  font-size: 0.78rem; color: var(--muted, #9a8a70);
}
.legend-item { display: flex; align-items: center; gap: 0.35rem; }
.legend-box { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
.legend-box.phase       { background: #3a3050; border: 1px solid #6858a0; }
.legend-box.pass        { background: #1a3a1a; border: 1px solid #4a8040; }
.legend-box.branch      { background: #3a3010; border: 1px solid #a08030; }
.legend-box.fail        { background: #3a1010; border: 1px solid #883030; }

.error-msg { color: #d06060; padding: 1rem; text-align: center; font-size: 0.88rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Quest Graph</h1>
  <p class="sub">Visual DAG of each quest line — phases, transitions, and outcomes. Click a phase node to inspect its <em>onComplete</em> effects.</p>

  <div class="toolbar">
    <label>Quest Line
      <select id="quest-select"></select>
    </label>
  </div>

  <div class="legend">
    <span class="legend-item"><span class="legend-box phase"></span> Phase node (click for detail)</span>
    <span class="legend-item"><span class="legend-box pass"></span> Complete outcome</span>
    <span class="legend-item"><span class="legend-box branch"></span> Branching outcome</span>
    <span class="legend-item"><span class="legend-box fail"></span> Fail outcome</span>
  </div>

  <div class="main-layout">
    <div class="graph-wrap" id="graph-wrap">
      <div class="error-msg">Loading&hellip;</div>
    </div>

    <div class="detail-panel" id="detail-panel">
      <div class="panel-title">Phase Detail</div>
      <div class="panel-empty" id="panel-empty">Click a phase node to see its effects.</div>
      <div id="panel-content" hidden></div>
    </div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// Predicate → human-readable string
// ---------------------------------------------------------------------------
function predicateToHuman(pred) {
  if (!pred || typeof pred !== 'object') return String(pred ?? '—');
  if (Array.isArray(pred)) return pred.map(predicateToHuman).join(', ');

  if ('all' in pred && Array.isArray(pred.all))
    return pred.all.map(predicateToHuman).join(' AND ');
  if ('any' in pred && Array.isArray(pred.any))
    return pred.any.map(predicateToHuman).join(' OR ');
  if ('not' in pred) return 'NOT ' + predicateToHuman(pred.not);

  if ('flag'      in pred) return 'flag: ' + pred.flag;
  if ('faction'   in pred) return 'faction ' + pred.faction + ' ' + (pred.relation || '>=') + ' ' + (pred.value ?? '?');
  if ('quest'     in pred) return 'quest ' + pred.quest + ' = ' + (pred.status ?? '?');
  if ('counter'   in pred) return 'counter ' + pred.counter + ' ' + (pred.relation || '>=') + ' ' + (pred.value ?? '?');
  if ('item'      in pred) return 'has item: ' + pred.item;
  if ('companion' in pred) return 'companion ' + pred.companion + ' recruited';
  if ('class'     in pred) return 'class = ' + pred.class;
  if ('stat'      in pred) return 'stat ' + pred.stat + ' >= ' + (pred.value ?? '?');
  if ('skillCheck'in pred) return 'skill check: ' + pred.skillCheck;
  return JSON.stringify(pred);
}

// ---------------------------------------------------------------------------
// Effect → human-readable string
// ---------------------------------------------------------------------------
function effectToHuman(eff) {
  if (!eff || typeof eff !== 'object') return String(eff);
  const t = eff.type || '?';
  switch (t) {
    case 'set_flag':             return 'Set flag: ' + eff.flag;
    case 'clear_flag':           return 'Clear flag: ' + eff.flag;
    case 'faction_delta':        return 'Faction ' + eff.faction + ' ' + (eff.amount >= 0 ? '+' : '') + eff.amount;
    case 'quest_log':            return 'Log: "' + (eff.text || '').slice(0, 60) + ((eff.text || '').length > 60 ? '…' : '') + '"';
    case 'gold':                 return 'Gold: +' + eff.amount;
    case 'reveal_nodes_tag':     return 'Reveal node (tag: ' + eff.tag + ', count: ' + (eff.count ?? 1) + ')';
    case 'unlock_map_transition':return 'Unlock map → ' + eff.targetMap;
    case 'companion_delta':      return 'Companion ' + eff.companion + ' approval ' + (eff.amount >= 0 ? '+' : '') + eff.amount;
    case 'pressure_delta':       return 'Pressure ' + (eff.amount >= 0 ? '+' : '') + eff.amount;
    case 'corruption_delta':     return 'Corruption ' + (eff.amount >= 0 ? '+' : '') + eff.amount;
    case 'counter_set':          return 'Counter ' + eff.counter + ' = ' + eff.value;
    case 'counter_add':          return 'Counter ' + eff.counter + ' += ' + eff.amount;
    case 'unlock_lore':          return 'Unlock lore: ' + eff.loreId;
    default:                     return t + (eff.flag ? ': ' + eff.flag : '');
  }
}

// ---------------------------------------------------------------------------
// Outcome type classification
// ---------------------------------------------------------------------------
function classifyOutcome(outcome) {
  const id = (outcome.id || '').toLowerCase();
  if (id.includes('fail') || id.includes('defeat') || id.includes('banish')) return 'fail';
  if (outcome.condition && 'any' in (outcome.condition || {})) return 'branch';
  return 'pass';
}

// ---------------------------------------------------------------------------
// SVG DAG layout (left-to-right phases, outcomes below last phase)
// ---------------------------------------------------------------------------
const NODE_W = 160;
const NODE_H = 50;
const H_GAP  = 56;
const PHASE_Y = 70;
const OUT_Y0  = PHASE_Y + NODE_H / 2 + 60 + NODE_H / 2;

const CLRS = {
  phase:  { fill: '#3a3050', stroke: '#6858a0', text: '#d0c8f0' },
  pass:   { fill: '#1a3a1a', stroke: '#4a8040', text: '#80c880' },
  branch: { fill: '#3a3010', stroke: '#a08030', text: '#d0a840' },
  fail:   { fill: '#3a1010', stroke: '#883030', text: '#d07070' },
};

const NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs) {
  const el = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, String(v));
  return el;
}
function svgText(text, x, y, opts = {}) {
  const el = svgEl('text', { x, y, 'text-anchor': opts.anchor || 'middle', 'font-size': opts.size || 11, fill: opts.fill || '#f0e8d8', 'font-weight': opts.bold ? '600' : '400' });
  el.textContent = text;
  return el;
}

function buildDAG(quest, onPhaseClick) {
  const phases   = quest.phases   || [];
  const outcomes = quest.outcomes || [];

  function phaseX(i)   { return H_GAP / 2 + i * (NODE_W + H_GAP) + NODE_W / 2; }
  function outcomeX(j) {
    if (outcomes.length === 0) return 0;
    const span  = outcomes.length * (NODE_W + H_GAP) - H_GAP;
    const start = Math.max(H_GAP / 2 + NODE_W / 2, phaseX(phases.length - 1) / 2 - span / 2 + NODE_W / 2);
    return start + j * (NODE_W + H_GAP);
  }

  const phaseRowW  = phases.length   ? H_GAP / 2 + (phases.length - 1)   * (NODE_W + H_GAP) + NODE_W + H_GAP / 2 : 400;
  const outRowW    = outcomes.length ? H_GAP / 2 + (outcomes.length - 1)  * (NODE_W + H_GAP) + NODE_W + H_GAP / 2 : 0;
  const svgW       = Math.max(600, phaseRowW, outRowW);
  const svgH       = outcomes.length > 0 ? OUT_Y0 + NODE_H / 2 + 30 : PHASE_Y + NODE_H / 2 + 30;

  const svg = svgEl('svg', { width: svgW, height: svgH, viewBox: `0 0 ${svgW} ${svgH}` });

  // Defs
  const defs = document.createElementNS(NS, 'defs');
  defs.innerHTML = `
    <marker id="arr-p" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#7068a8"/>
    </marker>
    <marker id="arr-o" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0,9 3.5,0 7" fill="#709070"/>
    </marker>
  `;
  svg.appendChild(defs);

  // Phase → phase arrows
  for (let i = 0; i < phases.length - 1; i++) {
    const x1 = phaseX(i) + NODE_W / 2, x2 = phaseX(i + 1) - NODE_W / 2;
    svg.appendChild(svgEl('line', { x1, y1: PHASE_Y, x2, y2: PHASE_Y, stroke: '#6858a0', 'stroke-width': '1.5', 'marker-end': 'url(#arr-p)' }));
    // Condition label
    if (phases[i].completeCondition) {
      const mid = (x1 + x2) / 2;
      const lbl = predicateToHuman(phases[i].completeCondition).slice(0, 28);
      svg.appendChild(svgText(lbl, mid, PHASE_Y - 10, { size: 9, fill: '#7a7090' }));
    }
  }

  // Phase nodes
  for (let i = 0; i < phases.length; i++) {
    const cx = phaseX(i), cy = PHASE_Y;
    const g  = document.createElementNS(NS, 'g');
    g.style.cursor = 'pointer';

    g.appendChild(svgEl('rect', { x: cx - NODE_W / 2, y: cy - NODE_H / 2, width: NODE_W, height: NODE_H, rx: 6, fill: CLRS.phase.fill, stroke: CLRS.phase.stroke, 'stroke-width': 1.5 }));

    // Phase index badge
    const badge = document.createElementNS(NS, 'text');
    badge.setAttribute('x', cx - NODE_W / 2 + 8); badge.setAttribute('y', cy - NODE_H / 2 + 12);
    badge.setAttribute('font-size', '9'); badge.setAttribute('fill', '#7a70a0');
    badge.textContent = String(i + 1);
    g.appendChild(badge);

    // Wrap label across two lines
    const words = (phases[i].label || phases[i].id).split(' ');
    let l1 = '', l2 = '';
    for (const w of words) {
      if ((l1 + ' ' + w).trim().length <= 20) l1 = (l1 + ' ' + w).trim();
      else l2 = (l2 + ' ' + w).trim();
    }
    l2 = l2.slice(0, 24);
    g.appendChild(svgText(l1, cx, cy + (l2 ? -5 : 5), { fill: CLRS.phase.text, bold: true }));
    if (l2) g.appendChild(svgText(l2, cx, cy + 11, { fill: CLRS.phase.text, size: 10 }));

    g.addEventListener('click', () => onPhaseClick(phases[i]));
    svg.appendChild(g);
  }

  // Last-phase → outcome arrows
  if (outcomes.length > 0 && phases.length > 0) {
    const lx = phaseX(phases.length - 1);
    const ly = PHASE_Y + NODE_H / 2;
    for (let j = 0; j < outcomes.length; j++) {
      const ox = outcomeX(j), oy = OUT_Y0;
      const my = (ly + oy - NODE_H / 2) / 2;
      const d  = `M ${lx} ${ly} C ${lx} ${my} ${ox} ${my} ${ox} ${oy - NODE_H / 2}`;
      svg.appendChild(svgEl('path', { d, fill: 'none', stroke: '#709070', 'stroke-width': 1.5, 'marker-end': 'url(#arr-o)' }));
    }
  }

  // Outcome nodes
  for (let j = 0; j < outcomes.length; j++) {
    const ox = outcomeX(j), oy = OUT_Y0;
    const cls = classifyOutcome(outcomes[j]);
    const c   = CLRS[cls] || CLRS.pass;
    const g   = document.createElementNS(NS, 'g');

    g.appendChild(svgEl('rect', { x: ox - NODE_W / 2, y: oy - NODE_H / 2, width: NODE_W, height: NODE_H, rx: 6, fill: c.fill, stroke: c.stroke, 'stroke-width': 1.5 }));
    g.appendChild(svgText((outcomes[j].id || 'outcome').replace(/_/g, ' ').slice(0, 24), ox, oy - 6, { fill: c.text, bold: true }));

    const condStr = outcomes[j].condition ? predicateToHuman(outcomes[j].condition).slice(0, 28) : '—';
    g.appendChild(svgText(condStr, ox, oy + 10, { fill: '#8a9080', size: 9 }));

    svg.appendChild(g);
  }

  return svg;
}

// ---------------------------------------------------------------------------
// Phase detail panel
// ---------------------------------------------------------------------------
function showPhaseDetail(phase) {
  document.getElementById('panel-empty').hidden   = true;
  const content = document.getElementById('panel-content');
  content.hidden = false;
  content.innerHTML = '';

  const titleEl = document.createElement('div');
  titleEl.className = 'panel-title';
  titleEl.textContent = phase.label || phase.id;
  content.appendChild(titleEl);

  const idEl = document.createElement('div');
  idEl.className = 'id-el';
  idEl.textContent = phase.id;
  content.appendChild(idEl);

  if (phase.completeCondition) {
    const ch = document.createElement('div'); ch.className = 'cond-head'; ch.textContent = 'Complete when:'; content.appendChild(ch);
    const cv = document.createElement('div'); cv.className = 'cond-val'; cv.textContent = predicateToHuman(phase.completeCondition); content.appendChild(cv);
  }

  if (phase.nextPhase) {
    const nx = document.createElement('div'); nx.className = 'next-el'; nx.textContent = 'Next phase: ' + phase.nextPhase; content.appendChild(nx);
  }

  const effs = phase.onComplete || [];
  if (!effs.length) {
    const ne = document.createElement('div'); ne.style.cssText = 'font-size:0.8rem;color:var(--muted);font-style:italic'; ne.textContent = 'No onComplete effects.'; content.appendChild(ne);
    return;
  }

  const eh = document.createElement('div'); eh.className = 'eff-head'; eh.textContent = 'onComplete effects:'; content.appendChild(eh);
  const ul = document.createElement('ul'); ul.className = 'effect-list';
  for (const eff of effs) {
    const li = document.createElement('li'); li.className = 'effect-item';
    li.innerHTML = '<span class="effect-type">' + (eff.type || '?') + '</span>' + effectToHuman(eff);
    ul.appendChild(li);
  }
  content.appendChild(ul);
}

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------
async function init() {
  const wrap = document.getElementById('graph-wrap');
  const sel  = document.getElementById('quest-select');
  let data;
  try {
    const res = await fetch('./data/story/quest-graph.json?' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (err) {
    wrap.innerHTML = '<div class="error-msg">Failed to load quest-graph.json: ' + err.message + '</div>';
    return;
  }

  const quests = data.quests || [];
  if (!quests.length) { wrap.innerHTML = '<div class="error-msg">No quests found.</div>'; return; }

  for (const q of quests) {
    const opt = document.createElement('option');
    opt.value = q.id;
    const cat = q.category === 'primary' ? 'Primary' : q.category === 'companion' ? 'Companion' : 'Side';
    opt.textContent = '[Act ' + (q.act ?? '?') + '] [' + cat + '] ' + (q.title || q.id);
    sel.appendChild(opt);
  }

  function render(id) {
    wrap.innerHTML = '';
    const quest = quests.find(q => q.id === id);
    if (!quest) { wrap.innerHTML = '<div class="error-msg">Quest not found.</div>'; return; }

    if (quest.summary) {
      const p = document.createElement('p');
      p.className = 'quest-summary';
      p.textContent = quest.summary;
      wrap.appendChild(p);
    }

    if (!quest.phases.length && !quest.outcomes.length) {
      const em = document.createElement('div');
      em.className = 'error-msg';
      em.style.color = 'var(--muted)';
      em.textContent = 'No phases or outcomes defined for this quest.';
      wrap.appendChild(em);
      return;
    }

    document.getElementById('panel-empty').hidden   = false;
    document.getElementById('panel-content').hidden = true;
    wrap.appendChild(buildDAG(quest, showPhaseDetail));
  }

  sel.addEventListener('change', () => render(sel.value));
  render(quests[0].id);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
