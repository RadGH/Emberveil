<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="rsg-game" content="Emberveil">
<script src="./_header.js" defer></script>
<script src="./_footer.js" defer></script>
<link rel="stylesheet" href="./_shared-styles.css">
<link rel="stylesheet" href="./_tool-styles.css">
<title>Story Campaign Sim — Emberveil</title>
<style>
body { padding: 1rem 1rem 5rem; }
.wrap { max-width: 900px; margin: 0 auto; }

h1 {
  font-family: 'Cinzel', Georgia, serif;
  font-size: 1.4rem; margin: 0 0 0.2rem;
  letter-spacing: 0.08em; text-transform: uppercase; font-weight: 900;
  background: linear-gradient(180deg,#f8d880 0%,#e8a040 40%,#c04030 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
p.sub { color: var(--muted); font-size: 0.82rem; margin: 0 0 1rem; }

/* Form */
.form-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;
  background: var(--card); border: 1px solid var(--border-subtle);
  border-radius: 8px; padding: 1rem; margin-bottom: 1rem;
}
@media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

.form-row { display: flex; flex-direction: column; gap: 0.25rem; }
.form-label { font-size: 0.82rem; color: var(--muted); }
.form-control {
  background: rgba(10,6,14,0.8); border: 1px solid var(--border-subtle);
  border-radius: 6px; color: var(--fg); font-size: 0.9rem;
  padding: 0.45rem 0.65rem; min-height: 40px;
}
.form-control:focus { outline: 2px solid rgba(232,160,32,0.4); border-color: rgba(232,160,32,0.4); }

.btn-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.btn {
  padding: 0.5rem 1.25rem; border-radius: 6px; border: 1px solid rgba(232,160,32,0.3);
  background: rgba(232,160,32,0.1); color: #e8a020; font-size: 0.9rem;
  font-weight: 600; cursor: pointer; min-height: 44px; transition: background 0.12s;
}
.btn:hover { background: rgba(232,160,32,0.22); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.secondary {
  border-color: rgba(120,100,200,0.3); background: rgba(120,100,200,0.1); color: #a090e0;
}

/* Log stream */
.sim-log {
  background: rgba(4,2,8,0.9); border: 1px solid rgba(232,160,32,0.12);
  border-radius: 8px; padding: 0.85rem; font-family: 'Courier New', monospace;
  font-size: 11.5px; color: #90c890; white-space: pre-wrap; min-height: 200px;
  max-height: 450px; overflow-y: auto; margin-bottom: 1rem; line-height: 1.55;
}

/* Summary card */
.summary-card {
  background: var(--card); border: 1px solid rgba(232,160,32,0.2);
  border-radius: 8px; padding: 1rem; display: none; margin-bottom: 1rem;
}
.summary-card.visible { display: block; }
.summary-title {
  font-family: 'Cinzel', serif; font-size: 1rem; color: #e8c070; margin-bottom: 0.6rem;
}
.summary-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.6rem;
}
.summary-stat {
  background: rgba(255,255,255,0.03); border-radius: 6px; padding: 0.5rem 0.7rem;
  text-align: center;
}
.summary-stat-value { font-size: 1.2rem; font-weight: 700; color: #e8a020; }
.summary-stat-label { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Story Campaign Sim</h1>
  <p class="sub">Run a headless campaign simulation and stream the log live. Results are downloadable as JSON.</p>

  <div class="form-grid">
    <div class="form-row">
      <label class="form-label" for="f-seed">Seed</label>
      <input type="text" id="f-seed" class="form-control" placeholder="random" value="">
    </div>
    <div class="form-row">
      <label class="form-label" for="f-storyteller">Storyteller</label>
      <select id="f-storyteller" class="form-control">
        <option value="chronicler">The Chronicler</option>
        <option value="ash_prophet">The Ash Prophet</option>
        <option value="warbringer">The Warbringer</option>
        <option value="trickster">The Trickster</option>
        <option value="pilgrim">The Pilgrim</option>
        <option value="iron_judge">The Iron Judge</option>
      </select>
    </div>
    <div class="form-row">
      <label class="form-label" for="f-difficulty">Difficulty</label>
      <select id="f-difficulty" class="form-control">
        <option value="relaxed">Relaxed</option>
        <option value="normal" selected>Normal</option>
        <option value="hard">Hard</option>
        <option value="nightmare">Nightmare</option>
      </select>
    </div>
    <div class="form-row">
      <label class="form-label" for="f-policy">Policy</label>
      <select id="f-policy" class="form-control">
        <option value="storyFirst" selected>Story First</option>
        <option value="deterministic">Deterministic</option>
        <option value="greedy">Greedy</option>
        <option value="random">Random</option>
        <option value="explorer">Explorer</option>
        <option value="combatHeavy">Combat Heavy</option>
      </select>
    </div>
    <div class="form-row">
      <label class="form-label" for="f-max-nodes">Max Nodes</label>
      <input type="number" id="f-max-nodes" class="form-control" value="200" min="10" max="2000">
    </div>
    <div class="form-row" style="align-self:flex-end">
      <div class="btn-row">
        <button class="btn" id="run-btn">Run Campaign</button>
        <button class="btn secondary" id="download-btn" disabled>Download JSON</button>
      </div>
    </div>
  </div>

  <pre class="sim-log" id="sim-log">Ready. Configure options above and click Run Campaign.</pre>

  <div class="summary-card" id="summary-card">
    <div class="summary-title">Campaign Result</div>
    <div class="summary-grid" id="summary-grid"></div>
  </div>
</div>

<script type="module">
let _lastResult = null;

function appendLog(msg) {
  const el = document.getElementById('sim-log');
  el.textContent += msg + '\n';
  el.scrollTop = el.scrollHeight;
}

document.getElementById('run-btn').addEventListener('click', async () => {
  const btn      = document.getElementById('run-btn');
  const log      = document.getElementById('sim-log');
  const dlBtn    = document.getElementById('download-btn');
  const summary  = document.getElementById('summary-card');
  const summGrid = document.getElementById('summary-grid');

  const seedRaw    = document.getElementById('f-seed').value.trim();
  const seed       = seedRaw ? seedRaw : Math.floor(Math.random() * 0xFFFFFF);
  const storyteller = document.getElementById('f-storyteller').value;
  const difficulty  = document.getElementById('f-difficulty').value;
  const policy      = document.getElementById('f-policy').value;
  const maxNodes    = parseInt(document.getElementById('f-max-nodes').value) || 200;

  btn.disabled = true;
  dlBtn.disabled = true;
  summary.classList.remove('visible');
  log.textContent = `[${new Date().toLocaleTimeString()}] Starting campaign sim\n`;
  appendLog(`  Seed: ${seed}`);
  appendLog(`  Storyteller: ${storyteller}`);
  appendLog(`  Difficulty: ${difficulty}`);
  appendLog(`  Policy: ${policy}`);
  appendLog(`  Max nodes: ${maxNodes}`);
  appendLog('');

  try {
    const { runCampaign } = await import('/sim/story/runCampaign.js');
    const { buildSyntheticGs } = await import('/sim/story/buildSyntheticGs.js');

    const gs = buildSyntheticGs({ seed, storytellerId: storyteller, difficulty });
    appendLog(`[gs] Built synthetic gs. Party: ${gs.party.map(h => `${h.class} L${h.level}`).join(', ')}`);

    // Run with live logging via a patched version
    const result = runCampaign(gs, { maxNodes, policy });
    _lastResult = { seed, storyteller, difficulty, policy, maxNodes, result, generatedAt: new Date().toISOString(), gs: { party: gs.party.map(h => ({ class: h.class, level: h.level, hp: h.hp, alive: h.alive })) } };

    // Log outcome
    appendLog('');
    appendLog(`[result] Outcome: ${result.outcome}`);
    appendLog(`[result] Nodes visited: ${result.nodesVisited}`);
    appendLog(`[result] Acts completed: ${result.actsCompleted || 0}`);
    appendLog(`[result] Deaths: ${result.deaths || 0}`);
    appendLog(`[result] Variety: ${(result.variety || 0).toFixed(2)}`);

    if (result.log && result.log.length) {
      appendLog('\n--- Node Log (last 20) ---');
      const last20 = result.log.slice(-20);
      for (const entry of last20) {
        appendLog(`  [${entry.node || '?'}] ${entry.type || ''} ${entry.outcome || ''}`);
      }
    }

    appendLog('\nDone.');

    // Summary card
    summGrid.innerHTML = [
      { label: 'Outcome',   value: result.outcome || '—' },
      { label: 'Nodes',     value: result.nodesVisited || 0 },
      { label: 'Acts',      value: result.actsCompleted || 0 },
      { label: 'Deaths',    value: result.deaths || 0 },
      { label: 'Variety',   value: (result.variety || 0).toFixed(2) },
      { label: 'Gold',      value: result.goldEarned || 0 },
    ].map(s => `
      <div class="summary-stat">
        <div class="summary-stat-value">${s.value}</div>
        <div class="summary-stat-label">${s.label}</div>
      </div>`).join('');
    summary.classList.add('visible');
    dlBtn.disabled = false;

  } catch (err) {
    appendLog(`\nError: ${err.message}`);
    appendLog(err.stack || '');
  }

  btn.disabled = false;
});

document.getElementById('download-btn').addEventListener('click', () => {
  if (!_lastResult) return;
  const blob = new Blob([JSON.stringify(_lastResult, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `campaign_sim_${Date.now()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
});
</script>
</body>
</html>
